<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F1EA" />

    <title>Socialkaari — Digital Marketing &amp; Advertising Agency in Bhopal</title>

      name="description"
      content="Socialkaari is a Bhopal digital marketing agency since 2014: social media management, SEO, branding, design & printing, paid ads, influencer and meme marketing. 20M+ impressions, 50+ clients."

    <!-- Fonts: Zodiak + General Sans (Fontshare by Indian Type Foundry), JetBrains Mono + Tiro Devanagari Hindi (Google) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,700,701&f[]=general-sans@400,500,600&display=swap"

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap"
